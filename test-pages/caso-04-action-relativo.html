<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caso 04: action relativo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    .esperado { padding: 10px 14px; border-left: 4px solid #555; background: #f3f4f6; }
    label { display: block; margin-top: 10px; }
    input { padding: 6px; }
    button { margin-top: 12px; padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Caso 04: action relativo</h1>

  <p class="esperado"><strong>Resultado esperado:</strong> o envio é bloqueado. O caminho relativo é resolvido contra a URL da página, que usa HTTP.</p>

  <p>O formulário tem <code>action="/login"</code>. Servida por <code>http://localhost:8080</code>, a resolução resulta em <code>http://localhost:8080/login</code>.</p>

  <form action="/login" method="POST">
    <label for="senha">Senha de teste</label>
    <input type="password" id="senha" name="senha" value="senha-de-teste">
    <button type="submit">Enviar</button>
  </form>

  <p><a href="index.html">Voltar ao índice</a></p>
</body>
</html>
